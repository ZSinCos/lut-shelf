<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUT 书架</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>LUT 书架</h1>
      <div class="header-actions">
        <button id="loadDirBtn" class="btn btn-primary">📂 选择目录</button>
        <span class="header-path" id="headerPath"></span>
        <span class="header-count" id="headerCount"></span>
        <span class="header-status" id="headerStatus"></span>
      </div>
    </header>

    <main class="main-layout">
      <!-- 左侧：文件夹树 -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-fav" id="favSection">
          <span class="fav-icon">⭐</span>
          <span class="fav-label">我的收藏</span>
          <span class="fav-count" id="favCount">0</span>
        </div>
        <div class="sidebar-header">
          <h2>文件夹</h2>
        </div>
        <div id="folderTree" class="folder-tree">
          <div class="empty-state"><p>点击「选择目录」</p></div>
        </div>
      </aside>

      <div class="splitter" id="splitterLeft"></div>

      <!-- 中间：书架网格 -->
      <section class="shelf-area" id="shelfArea">
        <div class="shelf-header" id="shelfHeader">
          <span class="shelf-title" id="shelfTitle">选择一个文件夹</span>
          <div class="shelf-controls">
            <span class="shelf-pagination" id="shelfPagination" style="display:none">
              <button id="pagePrevBtn" class="btn btn-small">◀</button>
              <span id="pageInfo" class="page-info">1 / 1</span>
              <button id="pageNextBtn" class="btn btn-small">▶</button>
            </span>
            <input type="text" id="shelfSearch" placeholder="搜索 LUT..." class="shelf-search" />
            <button id="shelfViewBtn" class="btn-icon" title="切换视图">⊞</button>
          </div>
        </div>
        <div class="shelf-grid" id="shelfGrid">
          <div class="empty-state"><p>选择一个文件夹查看 LUT</p></div>
        </div>
        <div id="previewOverlay" class="preview-overlay" style="display:none">
          <div class="preview-toolbar">
            <button id="previewBackBtn" class="btn">← 返回书架</button>
            <label class="btn">
              上传图片
              <input type="file" id="imageInput" accept="image/*,.rw2,.arw,.cr2,.cr3,.nef,.nrw,.orf,.raf,.dng" hidden />
            </label>
            <button id="clearImageBtn" class="btn">清除图片</button>
            <button id="toggleCompareBtn" class="btn" disabled>对比模式</button>
            <div class="intensity-group">
              <label for="intensitySlider" class="intensity-label">强度</label>
              <input type="range" id="intensitySlider" min="0" max="100" value="100" class="intensity-slider" disabled />
              <span id="intensityValue" class="intensity-value">100%</span>
            </div>
            <div class="export-group">
              <button id="exportBtn" class="btn" disabled>导出</button>
              <select id="exportFormat" class="btn export-format"><option value="png">PNG</option><option value="jpg">JPG</option></select>
            </div>
            <span id="statusText" class="status-text"></span>
          </div>
          <div class="preview-canvas-wrap">
            <canvas id="previewCanvas"></canvas>
            <div class="placeholder" id="placeholder">
              <p>拖入图片或点击「上传图片」</p>
            </div>
          </div>
        </div>
      </section>

      <div class="splitter" id="splitterRight"></div>

      <!-- 右侧：LUT 信息 -->
      <aside class="info-panel" id="infoPanel">
        <div class="info-empty" id="infoEmpty">
          <p>选择一个 LUT 查看详情</p>
        </div>
        <div class="info-content" id="infoContent" style="display:none">
          <div class="info-preview">
            <div class="info-section-label">效果预览</div>
            <canvas id="infoPreviewCanvas" class="info-preview-canvas"></canvas>
          </div>
          <div class="info-details">
            <div class="info-row"><span class="info-label">名称</span><span class="info-value" id="infoName"></span></div>
            <div class="info-row">
              <span class="info-label">作者</span>
              <input class="info-input" id="infoAuthor" placeholder="输入作者名..." />
            </div>
            <div class="info-row">
              <span class="info-label">风格</span>
              <input class="info-input" id="infoDesc" placeholder="输入风格说明..." />
            </div>
            <div class="info-row"><span class="info-label">格式</span><span class="info-value" id="infoFormat"></span></div>
            <div class="info-row"><span class="info-label">尺寸</span><span class="info-value" id="infoSize"></span></div>
            <div class="info-row"><span class="info-label">路径</span><span class="info-value info-path" id="infoPath"></span></div>
            <div class="info-row">
              <span class="info-label">心得体会</span>
              <textarea class="info-textarea" id="infoNotes" placeholder="写下你的使用心得..." rows="4"></textarea>
            </div>
          </div>
          <div class="info-actions">
            <button id="favBtn" class="btn fav-btn" style="flex:1">☆ 收藏</button>
            <button id="previewFromInfoBtn" class="btn" style="flex:1">🔍 完整预览</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="js/lut-parser.js"></script>
  <script src="js/lut-apply.js"></script>
  <script src="js/lut-webgl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
