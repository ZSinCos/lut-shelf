<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUT 预览工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>LUT 预览工具</h1>
      <div class="header-actions">
        <span class="lut-count" id="lutCount">未加载 LUT</span>
        <button id="loadLutDirBtn" class="btn btn-primary" title="选择 LUT 文件夹">📂 加载 LUT</button>
      </div>
    </header>

    <main class="main-layout">
      <aside class="lut-sidebar">
        <div class="sidebar-tabs">
          <button id="browseTabBtn" class="sidebar-tab active">浏览</button>
          <button id="repoTabBtn" class="sidebar-tab">仓库</button>
        </div>
        <div id="browseTab" class="sidebar-tab-content">
          <div class="sidebar-header">
            <div class="sidebar-title-row">
              <h2>LUT 列表</h2>
              <button id="sortFavBtn" class="btn-icon" title="按收藏排序">★</button>
            </div>
            <input type="text" id="lutSearch" placeholder="搜索 LUT..." />
          </div>
          <div id="lutList" class="lut-list">
            <div class="empty-state">
              <p>点击上方「加载 LUT」<br/>选择 LUT 文件夹</p>
            </div>
          </div>
        </div>
        <div id="repoTab" class="sidebar-tab-content" style="display:none">
          <div class="sidebar-header">
            <div class="sidebar-title-row">
              <h2 id="repoTitle">LUT 仓库</h2>
              <button id="repoSelectDirBtn" class="btn btn-small" title="选择仓库文件夹">📂 选择仓库</button>
            </div>
            <div id="repoBreadcrumb" class="repo-breadcrumb"></div>
          </div>
          <div id="repoContent" class="repo-content">
            <div class="empty-state" id="repoEmpty">
              <p>请先选择仓库文件夹</p>
            </div>
          </div>
          <div class="repo-actions" id="repoActions" style="display:none">
            <button id="repoImportBtn" class="btn btn-small">＋导入</button>
            <button id="repoNewFolderBtn" class="btn btn-small">＋新建文件夹</button>
          </div>
        </div>
      </aside>

      <section class="preview-area">
        <div class="toolbar">
          <label class="btn">
            上传图片
            <input type="file" id="imageInput" accept="image/*,.rw2,.arw,.cr2,.cr3,.nef,.nrw,.orf,.raf,.dng,.pef,.srw,.x3f" hidden />
          </label>
          <button id="toggleCompareBtn" class="btn" disabled>对比模式</button>
          <button id="dualLutBtn" class="btn" disabled>双 LUT</button>
          <div class="dual-lut-controls" id="dualLutControls" style="display:none">
            <select id="lutBSelect" class="btn lut-b-select" disabled>
              <option value="-1">LUT B（无）</option>
            </select>
            <div class="blend-group">
              <label for="blendSlider" class="intensity-label">混合</label>
              <input type="range" id="blendSlider" min="0" max="100" value="50" class="intensity-slider" disabled />
              <span id="blendValue" class="intensity-value">50%</span>
            </div>
          </div>
          <button id="fitViewBtn" class="btn" disabled>适应视图</button>
          <div class="intensity-group">
            <label for="intensitySlider" class="intensity-label">强度</label>
            <input type="range" id="intensitySlider" min="0" max="100" value="100" class="intensity-slider" disabled />
            <span id="intensityValue" class="intensity-value">100%</span>
          </div>
          <div class="export-group">
            <button id="exportBtn" class="btn" disabled>导出</button>
            <select id="exportFormat" class="btn export-format">
              <option value="png">PNG</option>
              <option value="jpg">JPG</option>
            </select>
          </div>
          <span id="statusText" class="status-text"></span>
        </div>
        <div class="canvas-container" id="canvasContainer">
          <canvas id="previewCanvas"></canvas>
          <div class="placeholder" id="placeholder">
            <div class="placeholder-icon">🖼️</div>
            <p>拖入图片或点击「上传图片」开始预览</p>
            <p class="placeholder-sub">支持 JPG / PNG / WebP / RAW（桌面版）</p>
          </div>
        </div>
        <div class="info-bar" id="infoBar" style="display:none">
          <span id="lutInfoName"></span>
          <span id="lutInfoMeta"></span>
        </div>
      </section>
    </main>
  </div>

  <div id="repoEditModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="editModalTitle">LUT 属性</h3>
        <button id="editModalClose" class="btn-icon">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label>评分</label>
          <div class="star-rating" id="editRating">
            <span class="star" data-val="1">☆</span>
            <span class="star" data-val="2">☆</span>
            <span class="star" data-val="3">☆</span>
            <span class="star" data-val="4">☆</span>
            <span class="star" data-val="5">☆</span>
          </div>
        </div>
        <div class="form-row">
          <label>备注</label>
          <textarea id="editNote" class="form-input form-textarea" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="editDeleteBtn" class="btn btn-danger">删除文件</button>
        <button id="editCancelBtn" class="btn">取消</button>
        <button id="editSaveBtn" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script src="js/lut-parser.js"></script>
  <script src="js/lut-apply.js"></script>
  <script src="js/lut-webgl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
